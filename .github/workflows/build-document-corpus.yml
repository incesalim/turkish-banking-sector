name: Build audit document corpus

# Separate from analytical snapshot publication. Stores immutable originals and
# source evidence only; a successful run never means the contents are verified.
on:
  workflow_run:
    workflows: ["Refresh audit reports", "Acquire audit reports"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      banks:
        description: "ALL or comma-separated registered bank tickers"
        type: string
        default: "ALL"
      period:
        description: "One YYYYQn; blank = all registered periods"
        type: string
        default: ""
      limit:
        description: "Maximum filings after filters; 0 = all"
        type: number
        default: 0
      publish:
        description: "Preserve originals and page evidence in the separate R2 corpus"
        type: boolean
        default: true
      structure:
        description: "Add source-linked tables, paragraphs and headings (unverified)"
        type: boolean
        default: true
      recheck_bytes:
        description: "Read every selected artifact again, bypassing unchanged-object receipts"
        type: boolean
        default: false
      kind:
        description: "Filing basis"
        type: choice
        options: [BOTH, consolidated, unconsolidated]
        default: BOTH
      ocr_pages:
        description: "Read-only OCR probe: up to four PDF pages; requires publish=false and limit=1..4"
        type: string
        default: ""
      ocr_dpi:
        description: "OCR probe rendering resolution"
        type: choice
        options: ["300", "450", "600"]
        default: "300"
      ocr_language:
        description: "OCR probe languages (pinned model files)"
        type: choice
        options: [eng+tur, tur+eng, eng, tur]
        default: eng+tur
      vector_pages:
        description: "Read-only outline probe: up to four PDF pages; requires publish=false and limit=1..4"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Read-only probes can inspect new code while a source-preservation fleet runs.
  # All publishing runs still share one queue.
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && format('audit-document-probe-{0}', github.run_id) || 'audit-document-corpus' }}
  queue: max
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Full scope uses disjoint filing hashes. Bounded probes stay one job.
        shard: ${{ fromJSON((github.event_name != 'workflow_dispatch' || ((inputs.banks == 'ALL' || inputs.banks == '') && inputs.limit == 0)) && '[0,1,2,3]' || '[0]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Preserve and verify source artifact bytes
        env:
          BANKS: ${{ inputs.banks || 'ALL' }}
          PERIOD: ${{ inputs.period }}
          LIMIT: ${{ inputs.limit || 0 }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          STRUCTURE: ${{ github.event_name != 'workflow_dispatch' || inputs.structure }}
          RECHECK_BYTES: ${{ inputs.recheck_bytes || false }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
          KIND: ${{ inputs.kind || 'BOTH' }}
          OCR_PAGES: ${{ inputs.ocr_pages }}
          OCR_DPI: ${{ inputs.ocr_dpi || '300' }}
          OCR_LANGUAGE: ${{ inputs.ocr_language || 'eng+tur' }}
          VECTOR_PAGES: ${{ inputs.vector_pages }}
        run: |
          args=(--from-r2 --capture --limit "$LIMIT" --shard-count "$SHARD_COUNT" --shard-index "$SHARD_INDEX")
          [ "$BANKS" != "ALL" ] && args+=(--bank "$BANKS")
          [ -n "$PERIOD" ] && args+=(--period "$PERIOD")
          [ "$KIND" != "BOTH" ] && args+=(--kind "$KIND")
          [ -n "$OCR_PAGES" ] && args+=(--ocr-pages "$OCR_PAGES" --ocr-dpi "$OCR_DPI" --ocr-language "$OCR_LANGUAGE")
          [ -n "$VECTOR_PAGES" ] && args+=(--vector-pages "$VECTOR_PAGES")
          [ "$PUBLISH" = "true" ] && args+=(--publish --discard-published)
          [ "$STRUCTURE" = "true" ] && args+=(--structure)
          [ "$RECHECK_BYTES" = "true" ] && args+=(--recheck-bytes)
          python scripts/build_document_corpus.py "${args[@]}"
      - name: Keep inventory and named outcomes, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ strategy.job-total > 1 && format('audit-document-corpus-report-{0}', matrix.shard) || 'audit-document-corpus-report' }}
          path: |
            data/audit_capture/corpus-v1/inventory.json
            data/audit_capture/corpus-v1/capture-results.json
          if-no-files-found: warn
          retention-days: 30
      - name: Keep bounded read-only probe evidence for independent review
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.limit > 0 && inputs.limit <= 4
        uses: actions/upload-artifact@v7
        with:
          name: audit-document-probe-evidence
          path: data/audit_capture/corpus-v1/sources/
          if-no-files-found: warn
          retention-days: 7
